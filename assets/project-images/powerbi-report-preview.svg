  <text x="652" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="17">Customers Distribution</text>
  <rect x="652" y="225" width="210" height="68" rx="10" fill="#40264b"/><text x="670" y="254" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Sales Volume by</text><text x="670" y="276" fill="#fff" font-family="Arial,sans-serif" font-size="17">Categories</text>
  <rect x="880" y="225" width="238" height="68" rx="10" fill="#40264b"/><text x="898" y="254" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Profit by</text><text x="898" y="276" fill="#fff" font-family="Arial,sans-serif" font-size="17">Categories</text>
  <rect x="652" y="315" width="210" height="68" rx="10" fill="#40264b"/><text x="670" y="344" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Filter</text><text x="670" y="366" fill="#fff" font-family="Arial,sans-serif" font-size="17">Gender</text>
  <rect x="880" y="315" width="238" height="68" rx="10" fill="#40264b"/><text x="898" y="344" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Filter</text><text x="898" y="366" fill="#fff" font-family="Arial,sans-serif" font-size="17">Club Membership</text>
