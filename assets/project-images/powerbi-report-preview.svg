<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">TGT DMDV Power BI report structure</title>
  <desc id="desc">A visual summary of the two report pages and their principal Power BI visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#191525"/>
      <stop offset="1" stop-color="#302056"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <text x="55" y="58" fill="#efeaff" font-family="Arial,sans-serif" font-size="28" font-weight="700">TGT_DMDV · Power BI report structure</text>
  <text x="55" y="88" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="16">Two-page dashboard for operational performance and customer analysis</text>
  <rect x="55" y="125" width="520" height="320" rx="16" fill="#111019" stroke="#a78bfa" stroke-width="2"/>
  <text x="82" y="165" fill="#a78bfa" font-family="Arial,sans-serif" font-size="22" font-weight="700">Performance Analysis</text>
  <text x="82" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="17">Average Profit Margin KPI</text>
  <rect x="82" y="225" width="210" height="68" rx="10" fill="#2d2450"/><text x="100" y="254" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Revenue by</text><text x="100" y="276" fill="#fff" font-family="Arial,sans-serif" font-size="17">Department</text>
  <rect x="310" y="225" width="210" height="68" rx="10" fill="#2d2450"/><text x="328" y="254" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Profit by</text><text x="328" y="276" fill="#fff" font-family="Arial,sans-serif" font-size="17">Department</text>
  <rect x="82" y="315" width="210" height="68" rx="10" fill="#2d2450"/><text x="100" y="344" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Top Cities by</text><text x="100" y="366" fill="#fff" font-family="Arial,sans-serif" font-size="17">Revenue</text>
  <rect x="310" y="315" width="210" height="68" rx="10" fill="#2d2450"/><text x="328" y="344" fill="#cfc7dc" font-family="Arial,sans-serif" font-size="14">Club</text><text x="328" y="366" fill="#fff" font-family="Arial,sans-serif" font-size="17">Membership</text>
  <rect x="625" y="125" width="520" height="320" rx="16" fill="#111019" stroke="#e879f9" stroke-width="2"/>
